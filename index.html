<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hecho por Lala — Joyería artesanal</title>
<meta name="description" content="Joyería de autor que explora las texturas y posibilidades del metal. Córdoba, Argentina.">
<link rel="preconnect" href="https://res.cloudinary.com">
<link rel="dns-prefetch" href="https://res.cloudinary.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F8F7F5;
    --text: #1A1A1A;
    --muted: #888;
    --stone: #B8A99A;
    --stone-light: #EDE8E3;
    --border: #E0D9D2;
    --card-bg: #FFFFFF;
    --badge-bg: #EDE8E3;
    --badge-text: #7A6A5A;
    --badge-active-bg: #1A1A1A;
    --badge-active-text: #F8F7F5;
    --wa: #25D366;
    --home-bg: #2C2A25;
    --logo-brown: #4A4232;
  }

  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── NAV ── */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .nav-left { display: flex; gap: 1.6rem; align-items: center; }
  .nav-right { display: flex; gap: 0.85rem; align-items: center; }
  .nav-link {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-decoration: none;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    padding: 0;
  }
  .nav-link:hover, .nav-link.active { color: var(--text); }
  .nav-ig {
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    color: var(--stone);
    text-decoration: none;
    transition: color 0.15s;
    display: inline-flex;
    align-items: center;
    padding: 0.2rem;
  }
  .nav-ig:hover { color: var(--text); }

  .nav-drawer-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    padding: 0;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .nav-drawer-btn:hover { border-color: var(--stone); background: #fff; }
  .burger-icon {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 14px;
    height: 10px;
  }
  .burger-icon span { display: block; height: 1.5px; background: var(--text); border-radius: 1px; }

  /* ── SECCIONES PRINCIPALES ── */
  #view-catalogo { display: block; }
  #view-amedida { display: none; }

  /* ── HERO BANNER ── */
  .home-hero {
    background-image: url('https://res.cloudinary.com/tgvqd4pc/image/upload/f_auto,q_auto:good,w_1400/c_fill,g_center,ar_16:9/v1790108220/IMG_5139.jpg');
    background-size: cover;
    background-position: center 30%;
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    text-align: center;
    gap: 1.8rem;
    position: relative;
    border-bottom: 1px solid var(--border);
  }

  .home-hero::before { content: ''; position: absolute; inset: 0; background: rgba(240, 235, 225, 0.58); }
  .home-hero > * { position: relative; z-index: 1; }
  .home-logo { width: min(380px, 75vw); height: auto; }
  .home-desc { max-width: 440px; font-size: 0.9rem; line-height: 1.8; color: #3A3020; letter-spacing: 0.02em; }
  .home-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #F8F7F5;
    background: #4A4232;
    border: none;
    border-radius: 2px;
    padding: 0.9rem 2.4rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 2px 12px rgba(74,66,50,0.18);
    text-decoration: none;
  }
  .home-cta:hover { background: #3A3020; transform: translateY(-1px); }

  /* ── CATÁLOGO / FILTROS ── */
  .catalogo-section { padding-top: 2rem; }
  .filters { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; padding: 1.5rem 1.5rem 2rem; }
  .filter-btn {
    font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 400; letter-spacing: 0.07em;
    padding: 0.4rem 1.1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--badge-bg);
    color: var(--badge-text); cursor: pointer; transition: all 0.18s ease;
  }
  .filter-btn.active { background: var(--badge-active-bg); color: var(--badge-active-text); border-color: var(--badge-active-bg); }
  .filter-btn:hover:not(.active) { border-color: var(--stone); color: var(--text); }

  /* ── MENÚ LATERAL (DRAWER) ── */
  .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(20, 18, 16, 0.45); z-index: 120; opacity: 0; transition: opacity 0.3s ease; }
  .drawer-backdrop.open { display: block; opacity: 1; }
  .drawer-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(300px, 80vw); background: #FFFFFF;
    z-index: 130; box-shadow: -4px 0 25px rgba(0, 0, 0, 0.1); transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;
  }
  .drawer-panel.open { transform: translateX(0); }
  .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 1.3rem 1.5rem; border-bottom: 1px solid var(--border); }
  .drawer-title { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; color: var(--text); }
  .drawer-close { background: none; border: none; font-size: 1.5rem; line-height: 1; color: var(--muted); cursor: pointer; padding: 0.2rem 0.4rem; }
  .drawer-close:hover { color: var(--text); }
  .drawer-content { flex: 1; overflow-y: auto; padding: 0.5rem 0; display: flex; flex-direction: column; }
  .drawer-item {
    font-family: 'Inter', sans-serif; font-size: 0.85rem; letter-spacing: 0.04em; color: var(--muted);
    padding: 0.95rem 1.5rem; background: none; border: none; text-align: left; cursor: pointer;
    transition: all 0.15s ease; display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-item:hover { background: var(--stone-light); color: var(--text); }
  .drawer-item.active { color: var(--text); font-weight: 500; background: var(--stone-light); }
  .drawer-item.active::after { content: "•"; color: var(--stone); font-size: 1.2rem; line-height: 0; }

  /* ── A MEDIDA ── */
  .amedida-container { max-width: 960px; margin: 0 auto; padding: 3.5rem 2rem 5rem; display: flex; flex-direction: column; align-items: center; gap: 3.5rem; }
  .amedida-header { max-width: 580px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .amedida-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--stone); font-weight: 500; }
  .amedida-title { font-size: 1.65rem; font-weight: 400; color: var(--text); line-height: 1.35; letter-spacing: 0.01em; }
  .amedida-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.8; }
  .amedida-btn {
    display: inline-flex; align-items: center; gap: 0.5rem; background: var(--wa); color: white;
    border: none; border-radius: 3px; padding: 0.85rem 1.8rem; font-family: 'Inter', sans-serif;
    font-size: 0.82rem; font-weight: 500; cursor: pointer; text-decoration: none; margin-top: 0.5rem;
    transition: opacity 0.15s, transform 0.15s; box-shadow: 0 2px 10px rgba(37,211,102,0.18);
  }
  .amedida-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .amedida-gallery-header { text-align: center; display: flex; flex-direction: column; gap: 0.4rem; }
  .amedida-gallery-title { font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); font-weight: 500; }
  .amedida-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4rem; width: 100%; }
  .amedida-card { background: #FFFFFF; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.2s; }
  .amedida-card:hover { border-color: var(--stone); }
  .amedida-card-img { width: 100%; aspect-ratio: 1/1; background: var(--stone-light); overflow: hidden; }
  .amedida-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease; }
  .amedida-card:hover .amedida-card-img img { transform: scale(1.03); }
  .amedida-card-body { padding: 0.9rem 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.25rem; }
  .amedida-card-name { font-size: 0.88rem; font-weight: 500; color: var(--text); }
  .amedida-card-tag { font-size: 0.72rem; color: var(--stone); letter-spacing: 0.04em; }

  .collab-section { width: 100%; border-top: 1px solid var(--border); padding-top: 3.5rem; display: flex; flex-direction: column; align-items: center; gap: 2.8rem; }
  .collab-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; width: 100%; }

  /* ── GRILLA CATÁLOGO ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.5rem; padding: 0 2rem 5rem; max-width: 1000px; margin: 0 auto; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.2s ease; cursor: pointer; }
  .card:hover { border-color: var(--stone); }
  .card-img { width: 100%; aspect-ratio: 3/4; background: var(--stone-light); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease, opacity 0.25s ease; }
  .card:hover .card-img img { transform: scale(1.03); }
  .no-foto { font-size: 0.62rem; letter-spacing: 0.1em; color: var(--stone); text-transform: uppercase; }
  .agotado-overlay { position: absolute; inset: 0; background: rgba(248,247,245,0.72); display: flex; align-items: center; justify-content: center; }
  .agotado-label { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); padding: 0.3rem 0.8rem; background: white; border-radius: 2px; }

  .card-body { padding: 0.9rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
  .card-category { font-size: 0.62rem; letter-spacing: 0.11em; color: var(--stone); text-transform: uppercase; }
  .card-name { font-size: 0.95rem; font-weight: 500; color: var(--text); line-height: 1.3; }
  .card-desc { font-size: 0.77rem; color: var(--muted); line-height: 1.55; flex: 1; margin-top: 0.1rem; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.85rem; padding-top: 0.85rem; border-top: 1px solid var(--border); }
  .card-price { font-size: 1rem; font-weight: 500; color: var(--text); }

  .wa-btn { display: inline-flex; align-items: center; gap: 0.3rem; font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 500; color: #fff; background: var(--wa); border: none; border-radius: 3px; padding: 0.38rem 0.7rem; cursor: pointer; text-decoration: none; transition: opacity 0.15s; white-space: nowrap; }
  .wa-btn:hover { opacity: 0.86; }
  .wa-icon { width: 12px; height: 12px; flex-shrink: 0; fill: white; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 5rem 1rem; color: var(--muted); font-size: 0.88rem; line-height: 1.7; }
  .loading { grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--muted); font-size: 0.82rem; letter-spacing: 0.06em; }

  footer { text-align: center; padding: 2rem 1rem; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; }
  footer a { color: var(--stone); text-decoration: none; }
  footer a:hover { color: var(--text); }

  /* ── MODAL ── */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(20,18,16,0.7); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--card-bg); border-radius: 4px; max-width: 760px; width: 100%; max-height: 90vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; position: relative; }
  .modal-close { position: absolute; top: 0.8rem; right: 0.9rem; background: none; border: none; font-size: 1.4rem; color: var(--muted); cursor: pointer; z-index: 10; line-height: 1; padding: 0.2rem 0.4rem; }
  .modal-close:hover { color: var(--text); }
  .modal-gallery { position: relative; background: var(--stone-light); aspect-ratio: 3/4; overflow: hidden; }
  .carousel-track { display: flex; height: 100%; transition: transform 0.3s ease; }
  .carousel-slide { min-width: 100%; height: 100%; }
  .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
