<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hecho por Lala — Joyería artesanal</title>
<meta name="description" content="Joyería de autor que explora las texturas y posibilidades del metal. Córdoba, Argentina.">
<link href="https://googleapis.com" rel="stylesheet">
<style>
 @media (max-width: 480px) {
    header, nav { display: flex !important; flex-direction: row !important; flex-wrap: wrap !important; justify-content: center !important; gap: 12px !important; padding: 10px 5px !important; }
    nav a { font-size: 11px !important; letter-spacing: 1px !important; }
 }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F8F7F5; --text: #1A1A1A; --muted: #888; --stone: #B8A99A; --stone-light: #EDE8E3; --border: #E0D9D2;
    --card-bg: #FFFFFF; --badge-bg: #EDE8E3; --badge-text: #7A6A5A; --badge-active-bg: #1A1A1A; --badge-active-text: #F8F7F5;
    --wa: #25D366; --home-bg: #2C2A25; --logo-brown: #4A4232;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 2rem; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 50; }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; margin-left: 1rem; }
  .nav-link { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); text-decoration: none; text-transform: uppercase; cursor: pointer; transition: color 0.15s; background: none; border: none; font-family: 'Inter', sans-serif; padding: 0; }
  .nav-link:hover, .nav-link.active { color: var(--text); }
  .nav-ig { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--stone); text-decoration: none; transition: color 0.15s; }
  .nav-ig:hover { color: var(--text); }
  #page-home { display: block; } #page-catalogo { display: none; }
  .home-hero { background-image: url('https://cloudinary.com'); background-size: cover; background-position: center 30%; min-height: 92vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem; text-align: center; gap: 2rem; position: relative; }
  .home-hero::before { content: ''; position: absolute; inset: 0; background: rgba(240, 235, 225, 0.55); }
  .home-hero > * { position: relative; z-index: 1; }
  .home-desc { max-width: 420px; font-size: 0.88rem; line-height: 1.8; color: #3A3020; letter-spacing: 0.02em; }
  .home-cta { display: inline-block; margin-top: 0.8rem; font-size: 1rem; letter-spacing: 0.14em; text-transform: uppercase; color: #F8F7F5; background: #4A4232; border: none; border-radius: 2px; padding: 1rem 2.8rem; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; transition: background 0.2s, transform 0.15s; box-shadow: 0 2px 12px rgba(74,66,50,0.18); }
  .home-cta:hover { background: #3A3020; transform: translateY(-1px); }
  .cat-header { padding: 2.5rem 2rem 0; text-align: center; margin-bottom: 2rem; }
  .cat-title { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .filters { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; padding: 1.5rem 1.5rem 1rem; }
  .filter-btn { font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 400; letter-spacing: 0.07em; padding: 0.4rem 1.1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--badge-bg); color: var(--badge-text); cursor: pointer; transition: all 0.18s ease; }
  .filter-btn.active { background: var(--badge-active-bg); color: var(--badge-active-text); border-color: var(--badge-active-bg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.5rem; padding: 0 2rem 5rem; max-width: 1000px; margin: 0 auto; }
  .loading { text-align: center; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.05em; padding: 3rem 0; }
</style>
</head>
<body>
  <nav>
    <div class="nav-links">
      <button class="nav-link active" id="nav-home" onclick="mostrarPagina('home')">Inicio</button>
      <button class="nav-link" id="nav-catalogo" onclick="mostrarPagina('catalogo')">Catálogo</button>
      <a class="nav-ig" href="https://instagram.com" target="_blank" style="display:inline-flex; align-items:center; gap:0.35rem;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
      </a>
    </div>
  </nav>

  <div id="page-home">
    <div class="home-hero">
      <div style="display:flex; flex-direction:column; align-items:center; gap:1.5rem;">
        <h1 style="font-family:'Inter',sans-serif; font-weight:300; font-size:2.2rem; letter-spacing:0.05em; color:#4A4232;">Hecho por Lala</h1>
        <p class="home-desc">Joyería de autor, desde mis clásicos de catálogo hasta diseños únicos.</p>
        <button class="home-cta" onclick="mostrarPagina('catalogo')">Ver Catálogo</button>
      </div>
    </div>
  </div>

  <div id="page-catalogo">
    <div class="cat-header"><span class="cat-title">Colecciones</span></div>
    <div class="filters">
      <button class="filter-btn active" onclick="filtrar('Todos', this)">Todos</button>
      <button class="filter-btn" onclick="filtrar('Clásicos', this)">Clásicos</button>
      <button class="filter-btn" onclick="filtrar('Exploración', this)">Exploración</button>
      <button class="filter-btn" onclick="filtrar('Línea Etérea', this)">Línea Etérea</button>
    </div>

    <div style="text-align: center; margin: 1.5rem 0 2rem;">
        <button type="button" onclick="toggleMenuLateral(true)" style="font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.6rem 1.6rem; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); cursor: pointer; border-radius: 2px; display: inline-flex; align-items: center; gap: 0.5rem;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            Filtrar por Tipo de Joya
        </button>
    </div>

    <div id="panel-lateral-filtros" style="position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: var(--card-bg); box-shadow: -4px 0 25px rgba(0,0,0,0.08); z-index: 9999; transition: right 0.3s ease; display: flex; flex-direction: column; padding: 2rem 1.5rem;">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 2rem;"><button type="button" onclick="toggleMenuLateral(false)" style="background: none; border: none; font-size: 1.2rem; color: var(--muted); cursor: pointer;">✕</button></div>
        <span style="font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone); margin-bottom: 1rem; font-weight: 500;">Categorías</span>
        <div id="contenedor-botones-laterales" style="display: flex; flex-direction: column; gap: 0.4rem;">
            <button class="filter-btn active" style="text-align: left; width: 100%; padding: 0.7rem 1rem; font-size: 0.75rem; border-radius:4px;" onclick="ejecutarFiltroLateral('Todos', this)">Todos los productos</button>
            <button class="filter-btn" style="text-align: left; width: 100%; padding: 0.7rem 1rem; font-size: 0.75rem; border-radius:4px;" onclick="ejecutarFiltroLateral('Anillos', this)">Anillos</button>
            <button class="filter-btn" style="text-align: left; width: 100%; padding: 0.7rem 1rem; font-size: 0.75rem; border-radius:4px;" onclick="ejecutarFiltroLateral('Aros', this)">Aros</button>
            <button class="filter-btn" style="text-align: left; width: 100%; padding: 0.7rem 1rem; font-size: 0.75rem; border-radius:4px;" onclick="ejecutarFiltroLateral('Collares', this)">Collares</button>
            <button class="filter-btn" style="text-align: left; width: 100%; padding: 0.7rem 1rem; font-size: 0.75rem; border-radius:4px;" onclick="ejecutarFiltroLateral('Pulseras', this)">Pulseras</button>
            <button class="filter-btn" style="text-align: left; width: 100%; padding: 0.7rem 1rem; font-size: 0.75rem; border-radius:4px;" onclick="ejecutarFiltroLateral('Brazaletes', this)">Brazaletes</button>
        </div>
    </div>
    <div id="cortina-pantalla" onclick="toggleMenuLateral(false)" style="position: fixed; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(2px); z-index: 9998; display: none; opacity: 0; transition: opacity 0.3s ease;"></div>

    <div class="grid" id="grid">
      <div class="loading">Cargando catálogo...</div>
    </div>
  </div>

   <script>
    function mostrarPagina(pagina) {
      document.getElementById('page-home').style.display = pagina === 'home' ? 'block' : 'none';
      document.getElementById('page-catalogo').style.display = pagina === 'catalogo' ? 'block' : 'none';
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
      const activeLink = document.getElementById(`nav-${pagina}`);
      if(activeLink) activeLink.classList.add('active');
      window.scrollTo(0,0);
    }

    function toggleMenuLateral(abrir) {
        const panel = document.getElementById('panel-lateral-filtros');
        const cortina = document.getElementById('cortina-pantalla');
        if (abrir) {
            cortina.style.display = 'block';
            setTimeout(() => { panel.style.right = '0'; cortina.style.opacity = '1'; }, 10);
        } else {
            panel.style.right = '-100%';
            cortina.style.opacity = '0';
            setTimeout(() => { cortina.style.display = 'none'; }, 300);
        }
    }

    function ejecutarFiltroLateral(categoria, elemento) {
        const botones = document.getElementById('contenedor-botones-laterales').getElementsByTagName('button');
        for (let btn of botones) { btn.classList.remove('active'); }
        elemento.classList.add('active');
        
        // Simula la pulsación del botón que espera tu lógica de JavaScript
        if (typeof filtrar === 'function') {
            filtrar(categoria, elemento);
        }
        setTimeout(() => { toggleMenuLateral(false); }, 250);
    }
  </script>
</body>
</html>
